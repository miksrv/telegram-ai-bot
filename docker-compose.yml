version: "3.9"

services:
  tars-bot:
    container_name: tars-bot
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist only the SQLite database / data dir. The application code is baked
      # into the image (see Dockerfile), so no source bind mount is needed.
      - ./data:/app/data

