# SonarCloud project configuration.
# Project/organization keys come from SonarCloud (Administration → Update Key).
sonar.projectKey=miksrv_telegram-ai-bot
sonar.organization=miksoft

# Source layout.
sonar.sources=core,database,handlers,services,utils,config,main.py
sonar.tests=tests
sonar.python.version=3.11

# Coverage: pytest --cov-report=xml writes coverage.xml at the repo root.
sonar.python.coverage.reportPaths=coverage.xml

# Don't count vendored/runtime data toward duplication or coverage.
sonar.exclusions=data/**,docs/**
sonar.coverage.exclusions=tests/**,main.py
