name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # Skip draft PRs; push to main always runs
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    env:
      BOT_TOKEN: fake_bot_token
      GROQ_API_KEY: fake_groq_key
      WEATHER_API_KEY: fake_weather_key
      ALLOWED_CHAT_IDS: "-100123456789"
      ADMIN_IDS: "123456789"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check --line-length 120 .

      - name: Check import order (isort)
        run: isort --check-only --profile black --line-length 120 .

      - name: Lint with pylint
        run: pylint $(git ls-files '*.py' | grep -v '^tests/')

      - name: Run tests
        run: pytest tests/ -v
